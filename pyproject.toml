[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kural"
version = "0.0.0"
description = "Open-source voice AI agent framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "Navnita" }]
keywords = ["voice", "ai", "agent", "telephony", "pipecat", "twilio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pipecat-ai[local,whisper,piper,deepgram,elevenlabs,kokoro]>=1.4",
    # pipecat's whisper module imports mlx_whisper unconditionally on Apple
    # Silicon (see pipecat/services/whisper/stt.py), so the package must be
    # present there even when we use the faster-whisper backend, not MLX.
    "mlx-whisper~=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "twilio>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
kural = "kural.server:main"

[project.urls]
Homepage = "https://github.com/nnavnita/kural"
Repository = "https://github.com/nnavnita/kural"
Issues = "https://github.com/nnavnita/kural/issues"

[tool.setuptools.packages.find]
include = ["kural*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=kural",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["kural"]
branch = true

[[tool.mypy.overrides]]
module = "twilio.*"
ignore_missing_imports = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
