# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server, and safe
# to hand-edit (the targets live below).
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit the
# targets, not these lines.
schema_version: 5
targets:
  T1:
    name: 'v0: echo agent runs end-to-end'
    status: achieved
    value: 5.0
    cost: 3.0
    actual_cost: 3.0
    acceptance:
    - Caller audio source (local mic or websocket) routed through Pipecat pipeline
    - Audio frames echo back to caller without LLM/STT/TTS in path
    - README quickstart `python -m kural.server` boots without errors
    - 'Manual smoke test: speak into mic, hear own voice back within 500ms'
    context: Smallest demonstrable Pipecat pipeline. Proves frame-processor wiring, audio in/out, and project bootstraps. No external API keys required.
    origin: bullseye_init
    discovered: 2026-06-30
    achieved: 2026-07-01
