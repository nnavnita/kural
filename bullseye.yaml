    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Twilio DTMF events parsed and exposed as a pipeline frame
    - Agent persona can declare DTMF prompts (e.g., "press 1 to confirm")
    - LLM receives DTMF input as a structured tool/message
    - Sample IVR-style persona in /examples uses DTMF
    context: Required for IVR-style flows, confirmations, and accessibility.
    depends_on:
    - T4
    origin: manual
    discovered: 2026-06-30
