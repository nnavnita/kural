    - HMAC signature header for verification
    - Exponential backoff retry (5 attempts) on non-2xx
    - Dead-letter store for failed deliveries
    - Per-persona webhook URL configurable
    context: Lets external systems react to call lifecycle without polling. Required for CRM/calendar integrations.
